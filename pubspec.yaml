name: contextlens
description: "Pre-publish video checker for creators."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  animations: ^3.0.0
  cloud_firestore: ^6.10.0
  connectivity_plus: ^7.3.2
  cross_file: ^0.3.5+5
  dio: ^5.11.1
  fc_native_video_thumbnail: ^2.1.1
  file_picker: ^13.1.0
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  share_handler: ^0.0.25
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/mock/
    - assets/sounds/
  shaders:
    - shaders/fire_text.frag

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600

# Brand images come from tool/render_brand_test.dart.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  background_color_ios: "#CFE4F5"
  adaptive_icon_background: "#CFE4F5"
  adaptive_icon_foreground: assets/icon/foreground.png
  # The foreground is already scaled to the 66 dp safe zone.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/monochrome.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#E6F1FA"
    theme_color: "#E6F1FA"

flutter_native_splash:
  color: "#E6F1FA"
  image: assets/splash/lens_mark.png
  android_12:
    color: "#E6F1FA"
    image: assets/splash/lens_mark_android12.png
